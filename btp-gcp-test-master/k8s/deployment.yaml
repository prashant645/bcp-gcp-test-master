apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-world
  namespace: demoapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hello-world
  template:
    metadata:
      labels:
        app: hello-world
        sidecar.istio.io/inject: "true"
    spec:
      imagePullSecrets:
        - name: hello-world-registry
      containers:
        - name: hello-world
          image: gtlc-production.common.repositories.cloud.sap/demoappdeploytokyma:IMAGE_TAG
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
